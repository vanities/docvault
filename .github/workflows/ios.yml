name: iOS

on:
  push:
    branches: [main]
    paths:
      [
        'ios/**',
        'web/server/**',
        'web/tools/**',
        'web/src/data/**',
        'web/package.json',
        'web/bun.lock',
        '.github/workflows/ios.yml',
      ]
  pull_request:
    paths:
      [
        'ios/**',
        'web/server/**',
        'web/tools/**',
        'web/src/data/**',
        'web/package.json',
        'web/bun.lock',
        '.github/workflows/ios.yml',
      ]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 120
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Build synthetic integration server assets
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Start isolated synthetic vault
        working-directory: web
        run: |
          bun tools/ios-ui-fixture.ts > "$RUNNER_TEMP/docvault-fixture.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/docvault-fixture.pid"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:31305/__test/counters > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/docvault-fixture.log"
          exit 1
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Test on an available iPhone simulator
        env:
          TEST_RUNNER_DOCVAULT_UI_TEST_SERVER: http://127.0.0.1:31305
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -version
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in sorted(d["devices"].items(), reverse=True) if "iOS" in k for v in vs if "iPhone" in v["name"]))')
          xcodebuild -project DocVault.xcodeproj -scheme DocVault \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -derivedDataPath build/DerivedData -resultBundlePath build/Tests.xcresult \
            -parallel-testing-enabled NO -collect-test-diagnostics never test | tee build/test.log
      - name: Stop synthetic vault
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/docvault-fixture.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/docvault-fixture.pid")" || true
          fi
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            ios/build/*.xcresult
            ios/build/test.log
            ${{ runner.temp }}/docvault-fixture.log
