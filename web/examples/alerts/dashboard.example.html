<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alert dashboard</title>
    <style>
      /* Fallbacks until DocVault posts its theme; applyTheme() overwrites them. */
      :root {
        --bg: #111318;
        --card: #16181e;
        --line: #262a33;
        --muted: #8891a5;
        --text: #d8dde9;
        --ok: #34d399;
        --warn: #fbbf24;
        --bad: #f87171;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 -apple-system,
          'Segoe UI',
          Helvetica,
          Arial,
          sans-serif;
      }
      h1 {
        font-size: 16px;
        margin: 0;
      }
      .muted {
        color: var(--muted);
        font-size: 12px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
        min-width: 0;
      }
      .grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        margin-top: 12px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
      }
      .chip {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 2px 6px;
        border-radius: 4px;
        white-space: nowrap;
      }
      .chip.ok {
        color: var(--muted);
        background: color-mix(in srgb, var(--muted) 15%, transparent);
      }
      .chip.warning {
        color: var(--warn);
        background: color-mix(in srgb, var(--warn) 15%, transparent);
      }
      .chip.critical {
        color: var(--bad);
        background: color-mix(in srgb, var(--bad) 15%, transparent);
      }
      .value {
        font:
          600 16px ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      td {
        padding: 8px 8px 8px 0;
        border-top: 1px solid var(--line);
        vertical-align: top;
      }
      tr:first-child td {
        border-top: 0;
      }
      td.num {
        text-align: right;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      svg {
        display: block;
        width: 100%;
        height: 56px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Waiting for data</h1>
      <div class="muted" id="subtitle"></div>
    </header>
    <section class="card" style="margin-top: 12px">
      <table id="checks"></table>
    </section>
    <section class="grid" id="charts"></section>

    <script>
      const byId = (id) => document.getElementById(id);
      // Report text is arbitrary; escape everything that goes into innerHTML.
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]
        );
      const fmt = (n) =>
        n.toLocaleString('en-US', { maximumFractionDigits: Math.abs(n) < 10 ? 4 : 1 });

      function applyTheme(theme) {
        const colors = (theme && theme.colors) || {};
        const map = {
          '--bg': 'surface-50',
          '--card': 'surface-100',
          '--line': 'surface-200',
          '--muted': 'surface-700',
          '--text': 'surface-950',
          '--ok': 'accent-400',
          '--warn': 'warn-400',
          '--bad': 'danger-400',
        };
        for (const [cssVar, token] of Object.entries(map)) {
          if (colors[token]) document.documentElement.style.setProperty(cssVar, colors[token]);
        }
      }

      function sparkline(values) {
        const points = values.map((v, i) => [i, v]).filter(([, v]) => typeof v === 'number');
        if (points.length < 2) return '<div class="muted">Not enough history yet</div>';
        const ys = points.map(([, v]) => v);
        let lo = Math.min(...ys);
        let hi = Math.max(...ys);
        const pad = (hi - lo || Math.abs(hi) * 0.001 || 1) * 0.1;
        lo -= pad;
        hi += pad;
        const W = 240;
        const H = 56;
        const last = values.length - 1 || 1;
        const x = (i) => 3 + (i / last) * (W - 6);
        const y = (v) => 3 + (1 - (v - lo) / (hi - lo)) * (H - 6);
        const d = points
          .map(([i, v], k) => `${k ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`)
          .join(' ');
        const [ei, ev] = points[points.length - 1];
        return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="history">
          <path d="${d}" fill="none" stroke="var(--ok)" stroke-width="1.5" />
          <circle cx="${x(ei)}" cy="${y(ev)}" r="2.5" fill="var(--ok)" />
        </svg>`;
      }

      function render({ source, theme }) {
        applyTheme(theme);
        const tripped = source.checks.filter((c) => c.active);
        byId('title').textContent = source.label;
        byId('subtitle').textContent =
          `${tripped.length ? `${tripped.length} tripped` : 'All clear'} · reported ` +
          (source.reportedAt ? new Date(source.reportedAt).toLocaleString() : 'never');

        byId('checks').innerHTML =
          source.checks
            .map((c) => {
              const state = c.active ? c.severity : 'ok';
              return `<tr>
                <td><span class="chip ${state}">${c.active ? esc(c.severity) : 'ok'}</span></td>
                <td>${esc(c.label)}<div class="muted">${esc(c.scope)}</div></td>
                <td class="num">${esc(c.value)}<div class="muted">trips ${esc(c.threshold)}</div></td>
              </tr>`;
            })
            .join('') || '<tr><td class="muted">No checks reported.</td></tr>';

        const keys = [...new Set(source.series.flatMap((p) => Object.keys(p.values)))];
        byId('charts').innerHTML = keys
          .map((key) => {
            const values = source.series.map((p) =>
              typeof p.values[key] === 'number' ? p.values[key] : null
            );
            const current = values.filter((v) => v != null).pop();
            return `<div class="card">
              <div class="row"><span class="muted">${esc(key)}</span>
              <span class="value">${current == null ? 'n/a' : fmt(current)}</span></div>
              ${sparkline(values)}
            </div>`;
          })
          .join('');
        postHeight();
      }

      const postHeight = () =>
        parent.postMessage(
          { type: 'docvault:alert:height', height: document.documentElement.scrollHeight },
          '*'
        );
      new ResizeObserver(postHeight).observe(document.body);

      window.addEventListener('message', (event) => {
        if (event.source !== parent || !event.data || event.data.type !== 'docvault:alert') return;
        render(event.data);
      });
      parent.postMessage({ type: 'docvault:alert:ready' }, '*');
    </script>
  </body>
</html>
